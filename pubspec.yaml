name: mp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  salomon_bottom_bar: ^3.3.2
  sqflite: ^2.3.3
  path: ^1.9.0
  http: ^1.6.0
  dio: ^5.9.2
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  provider: ^6.1.5+1
  audioplayers: ^6.4.0
  video_player: ^2.10.0
  chewie: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/appimages/
    - assets/Audio/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/appimages/LogoIcon.png"
  min_sdk_android: 21